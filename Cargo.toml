[package]
name = "emv-3ds"
version = "0.1.0"
edition = "2021"
description = "EMV 3-D Secure 2.x protocol — message types, state machine, and transaction lifecycle"
license = "MIT"
repository = "https://github.com/zuub-don/emv-3ds"
keywords = ["emv", "3ds", "3d-secure", "payments", "authentication"]
categories = ["web-programming"]
rust-version = "1.75"

[dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
uuid       = { version = "1", features = ["v4", "serde"] }
thiserror  = "1"
chrono     = { version = "0.4", features = ["serde"], default-features = false }

[dev-dependencies]
serde_json = "1"
proptest  = "1"
